# BC-250 GPU profiles.
# Minimum frequency uses the extended 350–2230 MHz DPM envelope exposed by the
# BC-250 CachyOS kernel. 600 MHz is the toolkit's conservative governor floor:
# low enough for idle/power savings, while avoiding the absolute 350 MHz floor.
#
# Only the Balanced profile has been validated on the reference system so far.
# Higher profiles remain explicit experimental starting points and must be
# validated per board/silicon/cooling.
[[profile]]
name = "stock"
frequency_mhz = 1850
voltage_mv = 930
min_frequency_mhz = 600
classification = "baseline"

[[profile]]
name = "balanced"
frequency_mhz = 2000
voltage_mv = 1000
min_frequency_mhz = 600
classification = "tested-on-reference-system"

[[profile]]
name = "aggressive"
frequency_mhz = 2100
voltage_mv = 1025
min_frequency_mhz = 600
classification = "experimental"

[[profile]]
name = "maximum-experimental"
frequency_mhz = 2200
voltage_mv = 1050
min_frequency_mhz = 600
classification = "experimental"
