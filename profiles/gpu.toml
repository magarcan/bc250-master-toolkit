# BC-250 GPU profiles using Cyan-Skillfish [[safe-points]] curves.
#
# Curve design is based on the AMD BC250 documentation and the safe-point
# structure used by the redbeard1083 toolkit. The top point of each profile
# preserves our existing tested/experimental targets; intermediate points
# now provide real frequency/voltage scaling instead of a two-state min/max
# governor envelope.
#
# Sources:
#   https://elektricm.github.io/amd-bc250-docs/system/power/
#   https://elektricm.github.io/amd-bc250-docs/system/governor/
#   https://github.com/redbeard1083/bc250-toolkit

[[profile]]
name = "stock"
classification = "baseline"
safe_points = [
  { frequency = 350, voltage = 700 },
  { frequency = 1000, voltage = 800 },
  { frequency = 1500, voltage = 900 },
  { frequency = 1850, voltage = 930 },
]

[[profile]]
name = "balanced"
classification = "tested-on-reference-system"
safe_points = [
  { frequency = 350, voltage = 700 },
  { frequency = 1000, voltage = 800 },
  { frequency = 1500, voltage = 900 },
  { frequency = 1850, voltage = 930 },
  { frequency = 2000, voltage = 1000 },
]

[[profile]]
name = "aggressive"
classification = "experimental"
safe_points = [
  { frequency = 350, voltage = 700 },
  { frequency = 1000, voltage = 800 },
  { frequency = 1500, voltage = 900 },
  { frequency = 1850, voltage = 930 },
  { frequency = 2000, voltage = 1000 },
  { frequency = 2100, voltage = 1025 },
]

[[profile]]
name = "maximum-experimental"
classification = "experimental"
safe_points = [
  { frequency = 350, voltage = 700 },
  { frequency = 1000, voltage = 800 },
  { frequency = 1500, voltage = 900 },
  { frequency = 1850, voltage = 930 },
  { frequency = 2000, voltage = 1000 },
  { frequency = 2100, voltage = 1025 },
  { frequency = 2200, voltage = 1050 },
]
