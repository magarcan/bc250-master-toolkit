name: apply UI cleanup
on:
  push:
    branches: [ui-cleanup-runner3]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply superficial UI cleanup
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('bc250-master-toolkit')
          s=p.read_text()
          s=s.replace('VERSION="1.13.0"','VERSION="1.13.1"',1)
          s=re.sub(r"show_preflight\(\)\{.*?\n\}\n\ntoolkit_status\(\)", '''show_preflight(){
            banner; heading '00 — PREFLIGHT / PLATFORM VALIDATION'; echo
            local card; card=$(bc250_gpu_card 2>/dev/null || true)
            [ -n "$card" ] || { warn 'AMD BC-250 GPU was not detected.'; return 1; }
            ok 'AMD BC-250 detected (PCI 1002:13fe).'
            printf '\\n  OS              : %s\\n  Kernel          : %s\\n  BIOS            : %s\\n  CPU             : %sC / %sT\\n  CPU driver      : %s\\n  CPU governor    : %s\\n  GPU             : %s\\n\\n' \\
              "$(. /etc/os-release 2>/dev/null; echo "${PRETTY_NAME:-Linux}")" "$(uname -r)" "$(bc250_bios)" \\
              "$(bc250_cpu_cores)" "$(bc250_cpu_threads)" "$(bc250_cpu_driver)" "$(bc250_cpu_governor)" "$card"
            bc250_bios_ok && ok 'BIOS P3.00 detected — recommended telemetry firmware.' || warn "BIOS $(bc250_bios) — P3.00 recommended."
            bc250_kernel_ok && ok 'CachyOS BC-250 kernel detected.' || warn "Kernel $(uname -r) — BC-250 kernel recommended."
            command -v cpupower >/dev/null 2>&1 && ok 'cpupower available' || warn 'cpupower missing'
            command -v vulkaninfo >/dev/null 2>&1 && ok 'vulkaninfo available' || warn 'vulkaninfo missing'
            [ -x /usr/bin/cyan-skillfish-governor-smu ] && ok 'Cyan-Skillfish binary installed' || warn 'Cyan-Skillfish binary missing'
            [ -f /etc/cyan-skillfish-governor-smu/config.toml ] && ok 'Cyan-Skillfish configuration present' || warn 'Cyan-Skillfish configuration missing'
            bc250_governor_ok && ok 'GPU governor service active' || warn 'GPU governor service inactive'
            bc250_telemetry_ok && ok 'GPU telemetry interfaces available' || warn 'GPU telemetry interfaces incomplete'
            [ -r "/sys/class/drm/$card/device/pp_dpm_sclk" ] && ok 'GPU DPM interface available' || warn 'GPU DPM interface unavailable'
            [ -r "/sys/class/drm/$card/device/mem_info_vram_total" ] && ok 'VRAM telemetry available' || warn 'VRAM telemetry unavailable'
            [ -x /usr/local/bin/bc250-cu-live-manager ] && ok 'CU/WGP manager installed' || warn 'CU/WGP manager missing'
            [ -x /usr/local/bin/umr ] || command -v umr >/dev/null 2>&1 && ok 'UMR available' || warn 'UMR missing'
          }

          toolkit_status(){
            banner; heading 'System Status'; echo
            printf '  BIOS                   %s\\n  Kernel                 %s\\n  CPU                    %sC / %sT\\n  CPU driver             %s\\n  CPU governor           %s\\n' \\
              "$(bc250_bios)" "$(uname -r)" "$(bc250_cpu_cores)" "$(bc250_cpu_threads)" "$(bc250_cpu_driver)" "$(bc250_cpu_governor)"
            local card h vr; card=$(bc250_gpu_card 2>/dev/null || true)
            if [[ "$card" == card* ]]; then
              h=$(bc250_hwmon "$card" 2>/dev/null || true); vr=$(bc250_gpu_vram "$card")
              printf '  GPU                    %s\\n  GPU SCLK               %s MHz\\n  GPU busy               %s%%\\n  GPU temp               %s°C\\n  VRAM                   %s/%s MB\\n  CPU temp               %s°C\\n  VRM temp               %s°C\\n\\n' \\
                "$card" "$(bc250_gpu_sclk "$h")" "$(bc250_gpu_busy "$card")" "$(bc250_gpu_temp "$h")" "${vr% *}" "${vr#* }" "$(bc250_cpu_temp)" "$(bc250_vrm_temp)"
            fi
            bc250_bios_ok && ok 'BIOS: P3.00 recommended firmware' || warn "BIOS: $(bc250_bios) — P3.00 recommended"
            bc250_kernel_ok && ok 'Kernel: BC-250 CachyOS kernel active' || warn "Kernel: $(uname -r) — BC-250 kernel not active"
            bc250_governor_ok && ok 'GPU governor: Cyan-Skillfish SMU ACTIVE' || warn 'GPU governor: inactive'
            [ -x /usr/local/bin/bc250-cu-live-manager ] && ok 'CU/WGP manager: installed' || warn 'CU/WGP manager: missing'
          }

          gpu_status(){
            banner; heading 'GPU Telemetry'; echo
            systemctl is-active --quiet cyan-skillfish-governor-smu.service && printf 'Service                : active\\n' || printf 'Service                : inactive\\n'
            local card h vr; card=$(bc250_gpu_card 2>/dev/null || true)
            if [[ "$card" == card* ]]; then
              h=$(bc250_hwmon "$card" 2>/dev/null || true); vr=$(bc250_gpu_vram "$card")
              printf 'GPU                    : %s\\nGPU SCLK               : %s MHz\\nGPU busy               : %s%%\\nGPU temp               : %s°C\\nVRAM                   : %s/%s MB\\nVRAM MCLK              : %s MHz\\n' \\
                "$card" "$(bc250_gpu_sclk "$h")" "$(bc250_gpu_busy "$card")" "$(bc250_gpu_temp "$h")" "${vr% *}" "${vr#* }" "$(bc250_gpu_mclk "$h")"
            else
              warn 'BC-250 GPU not detected.'
            fi
          }

          platform_gpu_governor_status(){
            banner; heading 'GPU Governor'; echo
            bc250_governor_ok && ok 'Cyan-Skillfish SMU governor service is active.' || warn 'Cyan-Skillfish SMU governor service is inactive.'
            [ -x /usr/bin/cyan-skillfish-governor-smu ] && ok 'Cyan-Skillfish binary installed.' || warn 'Cyan-Skillfish binary missing.'
            [ -f /etc/cyan-skillfish-governor-smu/config.toml ] && ok 'Governor configuration present.' || warn 'Governor configuration missing.'
            info 'Use Performance Lab → GPU for OC/UV profiles and safe-point curves.'
          }

          platform_menu(){
            while true; do
              banner; heading 'Platform Setup'; echo
              printf '[ 1]  BIOS                Check recommended P3.00 firmware\\n[ 2]  CachyOS Kernel       Install/activate linux-cachyos-bc250\\n[ 3]  GPU Governor         Verify Cyan-Skillfish SMU governor\\n[ 4]  CU / WGP             Install/update CU/WGP manager\\n[ 0]  Back\\n\\nEnter selection: '
              read -r s
              case "${s,,}" in
                1) bc250_bios_setup_menu_action; pause_screen;;
                2) bc250_kernel_setup_menu_action; pause_screen;;
                3) platform_gpu_governor_status; pause_screen;;
                4) run_privileged "$ROOT/bc250-master-toolkit" cu install; pause_screen;;
                0) return;;
              esac
            done
          }

          hardware_menu(){
            while true; do
              banner; heading 'Hardware & Telemetry'; echo
              printf 'Live hardware measurements and focused diagnostics.\\n\\n'
              printf '[ 1]  GPU Telemetry       Current GPU / temperature / VRAM snapshot\\n[ 2]  Memory / UMA         RAM/VRAM split and recommendations\\n[ 3]  CU / WGP             Compute-unit state and diagnostics\\n[ 0]  Back\\n\\nEnter selection: '
              read -r s
              case "${s,,}" in
                1) gpu_status; pause_screen;;
                2) memory_report; pause_screen;;
                3) run_privileged "$ROOT/bc250-master-toolkit" cu status; pause_screen;;
                0) return;;
              esac
            done
          }''', s, count=1, flags=re.S)
          p.write_text(s)
      - name: Validate
        run: bash -n bc250-master-toolkit
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ui-cleanup-final.yml
          git add bc250-master-toolkit .github/workflows/ui-cleanup-final.yml
          git commit -m 'refactor: clean up toolkit UI views'
          git push
